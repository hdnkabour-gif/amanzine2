name: Consolidation - regenerate exact reports
on:
  push:
    branches: [integration/unified-amanzine-20261115]
    paths-ignore:
      - "REPORTS/**"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate reports from the actual integrated code
        run: |
          npm run report:disconnected
          npm run report:ask-kind
          npm run report:lexicon
          npm run report:page-actions
          node scripts/audit.mjs
      - name: Commit exact generated reports on integration branch
        run: |
          git add REPORTS/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="amanzine-audit-bot" -c user.email="audit-bot@users.noreply.github.com" commit -m "docs: regenerate consolidated architecture and knowledge reports"
          git push origin HEAD:refs/heads/integration/unified-amanzine-20261115

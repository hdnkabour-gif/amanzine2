<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AMANZINE">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a7a48"/><stop offset="1" stop-color="#073c22"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d67e"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#a9781a"/></linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcf8ee"/><stop offset="1" stop-color="#efe4cd"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d43a2c"/><stop offset="1" stop-color="#9d1c15"/></linearGradient>
  </defs>

  <!-- الحقل الكريميّ داخل البوّابة -->
  <path d="M64 18 C44 27 32 43 32 66 L32 110 L96 110 L96 66 C96 43 84 27 64 18 Z" fill="url(#cr)"/>

  <!-- البوّابة = قوس أخضر بحدّ ذهبيّ مزدوج (حرف A) -->
  <path d="M32 110 L32 66 C32 43 44 27 64 18 C84 27 96 43 96 66 L96 110"
        fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 110 L32 66 C32 43 44 27 64 18 C84 27 96 43 96 66 L96 110"
        fill="none" stroke="url(#g)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- نجمة ثمانية (خاتم) — أحمر بحدّ ذهبي -->
  <g>
    <rect x="57" y="33" width="14" height="14" rx="1.7" fill="#c1272d" stroke="#d4af37" stroke-width="1.8"/>
    <rect x="57" y="33" width="14" height="14" rx="1.7" fill="#c1272d" stroke="#d4af37" stroke-width="1.8" transform="rotate(45 64 40)"/>
  </g>

  <!-- حرف Z (الصفقة) — أحمر بحدّ ذهبيّ (ألوان صلبة: الخطوط الأفقيّة لا تدعم التدرّج) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#d4af37" stroke-width="14"><path d="M48 62 H80"/><path d="M80 62 L48 92"/><path d="M48 92 H80"/></g>
    <g stroke="#c1272d" stroke-width="9.5"><path d="M48 62 H80"/><path d="M80 62 L48 92"/><path d="M48 92 H80"/></g>
  </g>
</svg>
